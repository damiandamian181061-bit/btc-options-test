# Deribit fees, from Deribit's published fee page. Loaded by optlab.simulator.fees (backtests)
# and optlab.simulator.rough_fees (the rough paper service, option sections only).
# Re-read 18 Nov 2026 for Phase 4: unchanged (page last updated 11 Nov 2026 09:46:20 UTC).
#
# Source:  https://support.deribit.com/hc/en-us/articles/25944746248989-Fees
# Page last updated 11 Nov 2026 09:46 UTC; read 15 Nov 2026. Damian confirmed these numbers on
# 15 Nov 2026 (Standard tier). The schedule applies from effective_from (the latest change on the
# page: 0 maker fees on linear daily options from 10 Nov 2026 12:00 UTC); a run on data before
# it must use an older schedule, and loading refuses that.
#
# Rates are fractions (0.0003 = 0.03% = 3 bps).
# Trading fee per leg = min(rate * underlying, cap_of_premium * option price) * amount (BTC),
# in the premium's currency. "Underlying" is the index price in USDC for linear options, and
# 1 BTC per contract for inverse options (whose premiums and fees are in BTC).
exchange: deribit
source: https://support.deribit.com/hc/en-us/articles/25944746248989-Fees
page_updated: 2026-11-11T09:46:20Z
read_on: 2026-11-15
confirmed: Damian, 15 Nov 2026
effective_from: 2026-11-10T12:00:00Z
tier: standard  # no volume or equity criteria; fee discounts never apply to delivery fees

trading:
  linear:  # BTC_USDC options: premiums and fees in USDC
    currency: USDC
    maker: "0.0003"
    taker: "0.0003"
    cap_of_premium: "0.125"
    # "USDC Options (Daily Expiries)": any option that does not expire on a Friday. Maker 0 from
    # 10 Nov 2026 12:00 UTC, "scheduled to remain in effect through 31 January 2027"; taker
    # unchanged; the cap still applies.
    daily_maker: "0"
    daily_maker_until: 2027-01-31
  inverse:  # BTC options: premiums and fees in BTC; inverse options are not affected by the above
    currency: BTC
    maker: "0.0003"
    taker: "0.0003"
    cap_of_premium: "0.125"

# Delivery (settlement at expiry), on in-the-money options only: rate * underlying * amount,
# "never higher than 12.5% of the option's value" (so 0 for an option that expires worthless).
# "The daily options ... are exempt from delivery fees." Since April 2026 (linear) and
# 1 August 2026 (inverse) an in-the-money option first becomes a position in its expiry's future;
# the option's delivery fee is charged once, then, and the future adds none (docs/brief.md).
delivery:
  linear:
    rate: "0.00015"
    cap_of_value: "0.125"
  inverse:
    rate: "0.00015"
    cap_of_value: "0.125"
  daily_exempt: true

# Perpetuals (Phase 4: the hedged benchmarks of Set B), Standard tier, re-read 18 Nov 2026 (page
# unchanged since 11 Nov 2026 09:46 UTC): "Perpetuals and futures" 1.5 / 3.5 bps maker / taker,
# as a fraction of the traded notional (amount in BTC x price). Paper fills are taker.
# The rough paper service ignores this section and the ones below.
perpetual:
  linear:  # BTC_USDC-PERPETUAL: 1 contract = 1 BTC, priced and settled in USDC
    currency: USDC
    maker: "0.00015"
    taker: "0.00035"

# Funding on perpetuals: no fee, paid between longs and shorts, continuously (Deribit's
# "Funding Specifications", https://support.deribit.com/hc/en-us/articles/31424939178397,
# updated 17 Nov 2026, read 18 Nov 2026):
#   premium rate = (perpetual mark - index) / index
#   funding rate = clamp(max(damper, premium) + min(-damper, premium), -cap, +cap)   (per 8 hours)
#   payment = funding rate x position size x (time held / 8 hours); positive: longs pay shorts.
# For a linear perpetual the position size is its notional in USDC (amount x index, as in the
# page's SOL_USDC example). The page lists caps of 0.5% (BTC), 1% (ETH) and 5% ("USDC & USDT");
# BTC_USDC-PERPETUAL takes the 5% column. The backtest samples mark and index once a minute.
funding:
  source: https://support.deribit.com/hc/en-us/articles/31424939178397-Funding-Specifications
  page_updated: 2026-11-17T09:15:02Z
  read_on: 2026-11-18
  damper: "0.00025"
  period_hours: 8
  cap:
    BTC_USDC-PERPETUAL: "0.05"
    BTC-PERPETUAL: "0.005"

# Option combos: Damian decided on 18 Nov 2026 not to model the combo discount in backtests
# (both legs pay, as the brief's leg-by-leg fills); Phase 8's testnet combo orders measure it.
combo_discount: false

# On the page but not modelled (docs/rough-version.md, docs/backtest.md):
# - option combo discount (above);
# - block trades 0.03%; VIP tiers (VIP1 from 100k USDC equity: 0.025%, cap 10.42%);
# - liquidation fees; collateral fees on negative balances; Deribit's fee rounding.
