# gitleaks: the default rules plus three for this project. Used by the pre-commit hook and CI.
title = "btc-options-lab"

[extend]
useDefault = true

# The server's address never goes in the repo (use SERVER_IP), so flag any public IPv4 address.
[[rules]]
id = "public-ipv4-address"
description = "Public IPv4 address: use a placeholder such as SERVER_IP"
regex = '''(?:^|[^0-9.])((?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9]))(?:[^0-9.]|$)'''
secretGroup = 1

[[rules.allowlists]]
description = "Unspecified, loopback, private, link-local and documentation ranges"
regexes = [
  '''^0\.0\.0\.0$''',
  '''^127\.''',
  '''^10\.''',
  '''^192\.168\.''',
  '''^172\.(?:1[6-9]|2[0-9]|3[01])\.''',
  '''^169\.254\.''',
  '''^192\.0\.2\.''',
  '''^198\.51\.100\.''',
  '''^203\.0\.113\.''',
]

[[rules.allowlists]]
description = "Version numbers in the lock file"
paths = ['''(^|/)uv\.lock$''']

# The R2 endpoint embeds the Cloudflare account ID; both stay out of the repo.
[[rules]]
id = "cloudflare-r2-endpoint"
description = "Cloudflare R2 endpoint (contains the account ID)"
regex = '''[0-9a-fA-F]{32}\.(?:[a-z]+\.)?r2\.cloudflarestorage\.com'''
keywords = ["r2.cloudflarestorage.com"]

[[rules]]
id = "cloudflare-account-id"
description = "Cloudflare account ID"
regex = '''(?i)account[_ -]?id["'\s:=]+([0-9a-f]{32})\b'''
secretGroup = 1
keywords = ["account"]

# Anyone holding a ping URL can mark a check healthy and hide an outage.
[[rules]]
id = "healthchecks-ping-url"
description = "healthchecks.io ping URL"
regex = '''hc-ping\.com/[0-9A-Za-z_-]{8,}'''
keywords = ["hc-ping.com"]
