# The restore test's own Compose project (run it with infra/restore-test, never directly).
# A throwaway TimescaleDB with its own volume and memory limit, and the restore job. Nothing
# here touches the live project "optlab": different project, container, network and volume.
# infra/restore-test removes all of it (containers, network, volume) when the test ends.
name: optlab-restore-test

services:
  restore-db:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: restore
      POSTGRES_PASSWORD: ${RESTORE_DB_PASSWORD:?set by infra/restore-test}
      POSTGRES_DB: restore
      NO_TS_TUNE: "true"
    # A scratch copy: durability settings off for speed.
    command: [postgres, -c, shared_buffers=256MB, -c, fsync=off, -c, synchronous_commit=off,
              -c, full_page_writes=off, -c, max_wal_size=2GB]
    volumes:
      - restore-pgdata:/var/lib/postgresql/data
    shm_size: 256m
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  restore:
    image: optlab:latest
    command: ["optlab-data", "restore-test"]
    depends_on:
      restore-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://restore:${RESTORE_DB_PASSWORD:?set by infra/restore-test}@restore-db:5432/restore
      OPTLAB_RESTORE_TARGET: throwaway
      LIVE_TRADING: ${LIVE_TRADING:-false}
      TRADING_MODE: ${TRADING_MODE:-paper}
      DERIBIT_ENV: ${DERIBIT_ENV:-public}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      HC_PING_URL_BACKUP: ${HC_PING_URL_BACKUP:-}
      HOME: /tmp
    mem_limit: 768m

volumes:
  restore-pgdata:
