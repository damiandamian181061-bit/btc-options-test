# Alembic configuration for the btc-options-lab database.
# The database URL comes from DATABASE_URL (via optlab.config.Settings), never from this file.
#
# On the server, back up first (see infra/server-setup.md), then:
#   infra/dc run --rm recorder alembic -c infra/alembic.ini upgrade head

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
